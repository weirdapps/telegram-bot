version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      # First, and deliberately without update-types, so it also catches
      # majors. @vitest/* pins an EXACT peer on vitest ('peer vitest@"4.1.11"
      # from @vitest/coverage-v8@4.1.11'), so a major offered one package at a
      # time gives npm ci an unresolvable tree and it dies on ERESOLVE before a
      # single test runs. The family only moves together.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # The same family again, because `applies-to` defaults to
      # 'version-updates' and a group without it never bundles SECURITY
      # updates: those stay one PR per vulnerable package. On 2026-09-10 that
      # split GHSA jobs for vitest and @vitest/mocker one second apart, and
      # the mocker job, resolving against a tree still on vitest@4.1.10, could
      # not reach the fixed 4.1.11 alone. It reported
      # security_update_not_possible and the run went red
      # (actions/runs/34426571705), while the sibling vitest job carried the
      # whole family and closed both alerts 105 seconds later.
      vitest-security:
        applies-to: security-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
